<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lintas Nusa AI Studio — Modular Creative Builder v8.0</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3B82F6; }

        .step-container { border-left: 3px solid #e5e7eb; padding-left: 24px; position: relative; }
        .step-container.active { border-color: #2563eb; }
        .step-container.done { border-color: #16a34a; opacity: 0.7; }
        .step-container.pending { opacity: 0.4; pointer-events: none; }

        .step-number {
            position: absolute; left: -14px; top: 0;
            width: 24px; height: 24px; border-radius: 50%;
            background: #e5e7eb; border: 2px solid white;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 800; color: #64748b;
        }
        .active .step-number { background: #2563eb; color: white; }
        .done .step-number { background: #16a34a; color: white; }
    </style>
</head>

<body class="bg-[#F8FAFC] text-slate-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const App = () => {

    /* ================= TRIAL SYSTEM (SAFE) ================= */
    const TRIAL_DAYS = 3;
    const [trialExpired, setTrialExpired] = useState(false);
    const [trialRemaining, setTrialRemaining] = useState(TRIAL_DAYS);

    useEffect(() => {
        let start = localStorage.getItem("LN_TRIAL_START_V8");
        if (!start) {
            start = Date.now();
            localStorage.setItem("LN_TRIAL_START_V8", start);
        }
        const elapsed = Date.now() - Number(start);
        const limit = TRIAL_DAYS * 24 * 60 * 60 * 1000;

        if (elapsed >= limit) {
            setTrialExpired(true);
            setTrialRemaining(0);
        } else {
            setTrialRemaining(
                Math.ceil((limit - elapsed) / (24 * 60 * 60 * 1000))
            );
        }
    }, []);

    /* ================= ORIGINAL STATE ================= */
    const [step, setStep] = useState(1);
    const [synopsis, setSynopsis] = useState("");
    const [numScenes, setNumScenes] = useState(4);

    /* ================= UI ================= */
    return (
        <div className="min-h-screen pb-24">

            {/* HEADER */}
            <header className="bg-white border-b border-slate-200 p-5 sticky top-0 z-50 flex justify-between items-center">
                <div>
                    <h1 className="font-black text-xl uppercase">
                        Lintas Nusa <span className="text-blue-600">AI Studio</span>
                    </h1>
                    <p className="text-[9px] tracking-widest text-slate-400 uppercase">
                        Modular Creative Builder v8.0
                    </p>
                </div>

                {/* TRIAL BADGE */}
                <div className="bg-blue-50 px-4 py-1.5 rounded-full border border-blue-100 flex items-center gap-2">
                    <div className={`w-2 h-2 rounded-full animate-pulse ${trialExpired ? 'bg-red-500' : 'bg-green-500'}`}></div>
                    <span className="text-[9px] font-black uppercase tracking-widest">
                        {trialExpired ? "Trial Expired" : `Trial • ${trialRemaining} Hari`}
                    </span>
                </div>
            </header>

            <main className="max-w-2xl mx-auto p-8 space-y-10">

                {/* STEP 1 */}
                <div className="step-container active">
                    <div className="step-number">1</div>
                    <h3 className="font-black text-xs uppercase mb-3">Story Core</h3>
                    <textarea
                        className="w-full p-4 border rounded-xl"
                        placeholder="Tuliskan inti cerita..."
                        value={synopsis}
                        onChange={e => setSynopsis(e.target.value)}
                    />
                    {synopsis && (
                        <button
                            onClick={() => setStep(2)}
                            className="mt-4 bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-xs uppercase">
                            Lanjut
                        </button>
                    )}
                </div>

                {/* STEP 2 */}
                {step >= 2 && (
                    <div className="step-container active">
                        <div className="step-number">2</div>
                        <h3 className="font-black text-xs uppercase mb-3">Jumlah Scene</h3>
                        <div className="flex gap-2">
                            {[3,4,5,6].map(n => (
                                <button
                                    key={n}
                                    onClick={() => setNumScenes(n)}
                                    className={`flex-1 py-3 rounded-xl border font-black text-xs
                                    ${numScenes === n ? 'bg-blue-600 text-white' : 'bg-white text-slate-400'}`}>
                                    {n} Scene
                                </button>
                            ))}
                        </div>

                        <button
                            onClick={() => setStep(3)}
                            className="mt-4 bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-xs uppercase">
                            Lanjut
                        </button>
                    </div>
                )}

                {/* STEP 3 – FINAL */}
                {step >= 3 && (
                    <div className="step-container active">
                        <div className="step-number">3</div>
                        <h3 className="font-black text-xs uppercase mb-4">Final Execution</h3>

                        <button
                            disabled={trialExpired}
                            className={`w-full py-6 rounded-[2.5rem] font-black uppercase tracking-widest text-sm
                            ${trialExpired
                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                : 'bg-blue-600 text-white hover:bg-blue-700'}`}>
                            {trialExpired ? "Trial Berakhir" : "Mulai Produksi Kreatif"}
                        </button>
                    </div>
                )}
            </main>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lintas Nusa AI Studio — Modular Creative Builder v8.0</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
        .step-container { border-left: 3px solid #e5e7eb; padding-left: 24px; position: relative; transition: all 0.4s ease; }
        .step-container.active { border-color: #2563eb; opacity: 1; }
        .step-container.done { border-color: #16a34a; opacity: 0.7; }
        .step-container.pending { opacity: 0.4; pointer-events: none; }
        .step-number { position: absolute; left: -14px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #64748b; transition: all 0.4s ease; }
        .active .step-number { background: #2563eb; color: white; transform: scale(1.1); box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
        .done .step-number { background: #16a34a; color: white; }
        .code-raw { background: #0f172a; color: #38bdf8; font-family: 'Courier New', monospace; border-radius: 12px; padding: 16px; font-size: 11px; line-height: 1.6; border: 1px solid #1e293b; white-space: pre-wrap; word-break: break-word; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
    </style>
</head>

<body class="bg-[#F8FAFC] text-slate-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ====== DATA ====== */
const STYLE_FAMILIES = {
    "Anime & Japanese Animation": [
        "Modern Cinematic Anime (Makoto Shinkai Style)",
        "Studio Ghibli Nostalgic Style",
        "90s Retro Hand-Drawn Anime",
        "Shonen Action Anime",
        "Cyberpunk Future Anime",
        "Samurai Historical Ink Style",
        "Dark Fantasy Seinen",
        "Slice of Life Soft Pastel",
        "Mythological Folklore Anime",
        "Post-Apocalyptic Anime"
    ]
};

const MOODS = [
    "Imut / Cute","Hangat / Cozy","Melankolis","Reflektif",
    "Dark","Horror","Misterius","Heroik","Magis","Epik"
];

const Icon = ({ name }) => {
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
    return <i data-lucide={name} className="w-5 h-5"></i>;
};

const App = () => {
    const [step, setStep] = useState(1);
    const [synopsis, setSynopsis] = useState("");
    const [styleFamily, setStyleFamily] = useState("Anime & Japanese Animation");
    const [subStyle, setSubStyle] = useState(STYLE_FAMILIES["Anime & Japanese Animation"][0]);
    const [mood, setMood] = useState("Hangat / Cozy");
    const [useCharacter, setUseCharacter] = useState(true);
    const [character, setCharacter] = useState({ name:"", role:"" });
    const [numScenes, setNumScenes] = useState(4);

    const getStepClass = (s) => {
        if (step === s) return "step-container active animate-slide-up";
        if (step > s) return "step-container done";
        return "step-container pending";
    };

    return (
    <div className="min-h-screen pb-24">

        {/* HEADER */}
        <header className="bg-white border-b p-5 sticky top-0 z-50 flex justify-between items-center">
            <div className="flex items-center gap-3">
                <div className="bg-blue-600 p-2 rounded-xl text-white">
                    <Icon name="star"/>
                </div>
                <div>
                    <h1 className="font-black text-xl uppercase">Lintas Nusa <span className="text-blue-600">AI Studio</span></h1>
                    <p className="text-[9px] font-bold tracking-widest text-slate-400 uppercase">Modular Creative Builder v8.0</p>
                </div>
            </div>
        </header>

        <!-- TRIAL NOTICE -->
        <div class="bg-slate-100 border-b border-slate-200 text-center py-2">
            <p class="text-[9px] font-bold text-slate-600 uppercase tracking-widest">
                Versi Trial — Jika tidak dapat diakses, masa trial telah berakhir
            </p>
        </div>

        <main className="max-w-2xl mx-auto p-8 space-y-12">
            <div className="text-center">
                <h2 className="text-3xl font-black uppercase italic">Narrative Engine</h2>
                <p className="text-[10px] font-bold tracking-widest text-slate-400 uppercase">
                    Story-Driven Production Workflow
                </p>
            </div>

            <div className={getStepClass(1)}>
                <div className="step-number">1</div>
                <h3 className="font-black text-xs uppercase mb-3">Story Core</h3>
                <textarea
                    value={synopsis}
                    onChange={e=>setSynopsis(e.target.value)}
                    className="w-full p-4 border rounded-xl h-32"
                    placeholder="Tuliskan inti cerita..."
                />
                {synopsis && (
                    <button onClick={()=>setStep(2)} className="mt-4 bg-blue-600 text-white px-6 py-2 rounded-xl font-black text-xs uppercase">
                        Lanjut
                    </button>
                )}
            </div>
        </main>

    </div>
    );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

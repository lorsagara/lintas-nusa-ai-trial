<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeminiVoice Studio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map untuk React & Lucide -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>

    <style>
        /* Custom Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300">
    
    <!-- Root Container -->
    <div id="root"></div>

    <!-- Application Script -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Play, Pause, Download, Trash2, History, Settings, 
            Volume2, Mic, FileText, Check, AlertCircle, Loader2,
            Moon, Sun, RefreshCw, Layers, FileAudio
        } from 'lucide-react';

        // ------------------------------------------------------------------
        // 1. LOGIC LAYER & API HANDLER
        // ------------------------------------------------------------------

        const API_CONFIG = {
            model: "gemini-2.5-flash-preview-tts",
            baseUrl: "https://generativelanguage.googleapis.com/v1beta/models"
        };

        const VOICES = [
            { name: "Kore", gender: "Female", style: "Calm" },
            { name: "Fenrir", gender: "Male", style: "Deep" },
            { name: "Puck", gender: "Male", style: "Energetic" },
            { name: "Zephyr", gender: "Female", style: "Soft" },
            { name: "Charon", gender: "Male", style: "Authoritative" },
            { name: "Aoede", gender: "Female", style: "Elegant" }
        ];

        const CONTEXT_MODES = {
            default: "Read the text clearly and naturally.",
            podcast: "Speak as a podcast host. Engaging, conversational, and dynamic tone.",
            advertisement: "Speak persuasively and enthusiastically, like a radio commercial.",
            storytelling: "Narrate with emotion and dramatic pacing, like reading an audiobook.",
            documentary: "Speak in a serious, informative, and calm documentary narration style.",
            meditation: "Speak very slowly, softly, and calmly for a guided meditation.",
            gaming: "Speak like a fantasy game character with high energy and dramatic flair."
        };

        // --- Audio Utility: Convert Raw PCM16 to WAV ---
        const pcmToWav = (pcmData, sampleRate = 24000) => {
            const buffer = new ArrayBuffer(44 + pcmData.length * 2);
            const view = new DataView(buffer);

            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            // RIFF identifier
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcmData.length * 2, 1);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, 1); // Subchunk1Size
            view.setUint16(20, 1, 1); // AudioFormat (1 is PCM)
            view.setUint16(22, 1, 1); // NumChannels (Mono)
            view.setUint32(24, sampleRate, 1); // SampleRate
            view.setUint32(28, sampleRate * 2, 1); // ByteRate
            view.setUint16(32, 2, 1); // BlockAlign
            view.setUint16(34, 16, 1); // BitsPerSample
            writeString(view, 36, 'data');
            view.setUint32(40, pcmData.length * 2, 1);

            // Write PCM samples
            for (let i = 0; i < pcmData.length; i++) {
                view.setInt16(44 + i * 2, pcmData[i], 1);
            }

            return new Blob([view], { type: 'audio/wav' });
        };

        // --- Base64 Utility ---
        const base64ToInt16Array = (base64) => {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Int16Array(len / 2);
            for (let i = 0; i < len; i += 2) {
                bytes[i / 2] = (binaryString.charCodeAt(i + 1) << 8) | binaryString.charCodeAt(i);
            }
            return bytes;
        };

        // --- SRT Generator (Estimation) ---
        const formatTime = (seconds) => {
            const date = new Date(0);
            date.setMilliseconds(seconds * 1000);
            return date.toISOString().substr(11, 12).replace('.', ',');
        };

        const generateSRT = (text, durationSeconds) => {
            const words = text.split(/\s+/);
            const timePerWord = durationSeconds / words.length;
            let srtContent = "";
            let currentTime = 0;
            
            // Group words into chunks of ~5 for subtitles
            const chunkSize = 5;
            for (let i = 0; i < words.length; i += chunkSize) {
                const chunk = words.slice(i, i + chunkSize).join(" ");
                const startTime = formatTime(currentTime);
                currentTime += timePerWord * chunk.split(" ").length;
                const endTime = formatTime(currentTime);
                
                srtContent += `${(i / chunkSize) + 1}\n${startTime} --> ${endTime}\n${chunk}\n\n`;
            }
            return srtContent;
        };

        // ------------------------------------------------------------------
        // 2. MAIN APP COMPONENT
        // ------------------------------------------------------------------

        function GeminiVoiceStudio() {
            // -- State Management --
            const [text, setText] = useState("");
            const [loading, setLoading] = useState(false);
            const [progress, setProgress] = useState(0);
            const [audioUrl, setAudioUrl] = useState(null);
            const [audioBlob, setAudioBlob] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [history, setHistory] = useState([]);
            const [darkMode, setDarkMode] = useState(true);
            const [showHistory, setShowHistory] = useState(false);
            const [toast, setToast] = useState(null);

            // -- Settings State --
            const [voice, setVoice] = useState("Kore");
            const [contextMode, setContextMode] = useState("default");
            const [speed, setSpeed] = useState(1.0);
            
            const audioRef = useRef(null);
            // NOTE: In a real app, use a backend proxy. For demo, we use empty string or user provided key.
            const apiKey = ""; 

            // -- Initialization --
            useEffect(() => {
                const savedHistory = localStorage.getItem('gemini_voice_history');
                if (savedHistory) setHistory(JSON.parse(savedHistory));
                
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    setDarkMode(false);
                }
            }, []);

            // Apply Dark Mode Class to Body
            useEffect(() => {
                if (darkMode) {
                    document.body.classList.add('dark');
                    document.body.style.backgroundColor = '#0f172a'; // slate-900
                } else {
                    document.body.classList.remove('dark');
                    document.body.style.backgroundColor = '#f8fafc'; // slate-50
                }
            }, [darkMode]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleGenerate = async () => {
                if (!text.trim()) {
                    showToast("Please enter some text first.", "error");
                    return;
                }
                
                setLoading(true);
                setProgress(10);
                setAudioUrl(null);
                setAudioBlob(null);

                const contextInstruction = CONTEXT_MODES[contextMode];
                const finalPrompt = text; 

                try {
                    const fetchWithRetry = async (retries = 3, delay = 1000) => {
                        try {
                            setProgress(30);
                            const response = await fetch(
                                `${API_CONFIG.baseUrl}/${API_CONFIG.model}:generateContent?key=${apiKey}`,
                                {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        contents: [{ parts: [{ text: finalPrompt }] }],
                                        generationConfig: {
                                            responseModalities: ["AUDIO"],
                                            speechConfig: {
                                                voiceConfig: {
                                                    prebuiltVoiceConfig: { voiceName: voice }
                                                }
                                            }
                                        },
                                        systemInstruction: {
                                            parts: [{ text: `${contextInstruction} Speaking rate: ${speed}x.` }]
                                        }
                                    })
                                }
                            );

                            if (!response.ok) throw new Error(`API Error: ${response.status}`);
                            return await response.json();
                        } catch (err) {
                            if (retries > 0) {
                                await new Promise(res => setTimeout(res, delay));
                                return fetchWithRetry(retries - 1, delay * 2);
                            }
                            throw err;
                        }
                    };

                    const result = await fetchWithRetry();
                    setProgress(70);

                    const base64Audio = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                    
                    if (!base64Audio) throw new Error("No audio data received.");

                    const pcmData = base64ToInt16Array(base64Audio);
                    const wavBlob = pcmToWav(pcmData);
                    const url = URL.createObjectURL(wavBlob);

                    setAudioBlob(wavBlob);
                    setAudioUrl(url);
                    setProgress(100);
                    showToast("Audio generated successfully!");

                    const newEntry = {
                        id: Date.now(),
                        text: text.substring(0, 50) + (text.length > 50 ? "..." : ""),
                        fullText: text,
                        date: new Date().toLocaleDateString(),
                        voice,
                        mode: contextMode
                    };
                    const updatedHistory = [newEntry, ...history].slice(0, 10);
                    setHistory(updatedHistory);
                    localStorage.setItem('gemini_voice_history', JSON.stringify(updatedHistory));

                } catch (error) {
                    console.error(error);
                    showToast("Failed to generate audio. Please check console/API Key.", "error");
                } finally {
                    setLoading(false);
                    setTimeout(() => setProgress(0), 1000);
                }
            };

            const handleDownload = (format) => {
                if (!audioBlob) return;
                const fileName = `voiceover-${Date.now()}`;
                const link = document.createElement('a');
                
                if (format === 'wav') {
                    link.href = audioUrl;
                    link.download = `${fileName}.wav`;
                    link.click();
                } else if (format === 'srt') {
                    const duration = audioBlob.size / 48000;
                    const srtContent = generateSRT(text, duration);
                    const blob = new Blob([srtContent], { type: 'text/plain' });
                    link.href = URL.createObjectURL(blob);
                    link.download = `${fileName}.srt`;
                    link.click();
                }
            };

            const loadFromHistory = (item) => {
                setText(item.fullText);
                setVoice(item.voice);
                setContextMode(item.mode);
                setShowHistory(false);
                showToast("Project loaded from history");
            };

            const deleteFromHistory = (id) => {
                const newHistory = history.filter(h => h.id !== id);
                setHistory(newHistory);
                localStorage.setItem('gemini_voice_history', JSON.stringify(newHistory));
            };

            const togglePlayback = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                } else {
                    audioRef.current.play();
                }
                setIsPlaying(!isPlaying);
            };

            return (
                <div className={`min-h-screen font-sans ${darkMode ? 'text-slate-100' : 'text-slate-900'}`}>
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-4 py-2 rounded shadow-lg flex items-center gap-2 animate-fade-in ${
                            toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'
                        }`}>
                            {toast.type === 'error' ? <AlertCircle size={18}/> : <Check size={18}/>}
                            {toast.message}
                        </div>
                    )}

                    {/* Header */}
                    <header className={`px-6 py-4 flex justify-between items-center border-b ${darkMode ? 'border-slate-700 bg-slate-900/95' : 'border-slate-200 bg-white/95'} sticky top-0 z-40 backdrop-blur`}>
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold">
                                G
                            </div>
                            <h1 className="text-xl font-bold tracking-tight">Gemini<span className="text-indigo-500">Voice</span> Studio</h1>
                        </div>
                        
                        <div className="flex items-center gap-3">
                            <button 
                                onClick={() => setShowHistory(!showHistory)}
                                className={`p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition relative ${showHistory ? 'text-indigo-500' : ''}`}
                            >
                                <History size={20} />
                                {history.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>}
                            </button>
                            <button 
                                onClick={() => setDarkMode(!darkMode)}
                                className="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition"
                            >
                                {darkMode ? <Sun size={20} /> : <Moon size={20} />}
                            </button>
                        </div>
                    </header>

                    <main className="container mx-auto p-4 md:p-6 lg:p-8 max-w-6xl">
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            
                            {/* Left Panel: Inputs */}
                            <div className="lg:col-span-7 space-y-6">
                                <div className={`p-1 rounded-xl bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 ${loading ? 'animate-pulse' : ''}`}>
                                    <div className={`rounded-lg p-4 h-full ${darkMode ? 'bg-slate-800' : 'bg-white'}`}>
                                        <div className="flex justify-between mb-2">
                                            <label className="text-sm font-medium flex items-center gap-2 text-indigo-500">
                                                <FileText size={16} /> Script
                                            </label>
                                            <span className="text-xs text-slate-400">{text.length} chars</span>
                                        </div>
                                        <textarea
                                            value={text}
                                            onChange={(e) => setText(e.target.value)}
                                            placeholder="Enter your script here..."
                                            className={`w-full h-64 p-3 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-transparent font-mono text-sm leading-relaxed ${darkMode ? 'text-slate-200' : 'text-slate-700'}`}
                                            spellCheck="false"
                                        />
                                    </div>
                                </div>

                                <div className={`p-6 rounded-xl border ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`}>
                                    <div className="flex items-center gap-2 mb-4">
                                        <Settings size={18} className="text-indigo-500" />
                                        <h2 className="font-semibold">Voice Settings</h2>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-xs uppercase tracking-wide opacity-70 mb-2">Persona</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {VOICES.map((v) => (
                                                    <button
                                                        key={v.name}
                                                        onClick={() => setVoice(v.name)}
                                                        className={`px-3 py-2 rounded-lg text-sm flex flex-col items-start border transition-all ${
                                                            voice === v.name 
                                                            ? 'border-indigo-500 bg-indigo-500/10 text-indigo-500' 
                                                            : darkMode ? 'border-slate-600 hover:bg-slate-700' : 'border-slate-200 hover:bg-slate-50'
                                                        }`}
                                                    >
                                                        <span className="font-medium">{v.name}</span>
                                                        <span className="text-xs opacity-60">{v.gender} • {v.style}</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs uppercase tracking-wide opacity-70 mb-2">Context Mode</label>
                                            <div className="space-y-2">
                                                <select 
                                                    value={contextMode}
                                                    onChange={(e) => setContextMode(e.target.value)}
                                                    className={`w-full p-2 rounded-lg border ${darkMode ? 'bg-slate-900 border-slate-600' : 'bg-slate-50 border-slate-200'}`}
                                                >
                                                    {Object.keys(CONTEXT_MODES).map(mode => (
                                                        <option key={mode} value={mode}>{mode.charAt(0).toUpperCase() + mode.slice(1)}</option>
                                                    ))}
                                                </select>
                                                <p className="text-xs opacity-60 italic p-1">
                                                    "{CONTEXT_MODES[contextMode].substring(0, 60)}..."
                                                </p>
                                            </div>
                                            <div className="mt-4">
                                                <label className="block text-xs uppercase tracking-wide opacity-70 mb-2">Speaking Pace</label>
                                                <input 
                                                    type="range" min="0.5" max="2" step="0.1" 
                                                    value={speed}
                                                    onChange={(e) => setSpeed(e.target.value)}
                                                    className="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-500"
                                                />
                                                <div className="flex justify-between text-xs opacity-60 mt-1">
                                                    <span>Slow</span>
                                                    <span>{speed}x</span>
                                                    <span>Fast</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* Right Panel */}
                            <div className="lg:col-span-5 space-y-6">
                                <div className={`rounded-xl overflow-hidden border ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200 shadow-sm'}`}>
                                    <div className="p-6 text-center border-b border-inherit">
                                        {loading ? (
                                            <div className="py-10 flex flex-col items-center justify-center space-y-4">
                                                <Loader2 size={40} className="animate-spin text-indigo-500" />
                                                <p className="text-sm font-medium animate-pulse">Synthesizing audio...</p>
                                                <div className="w-64 h-2 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                                                    <div className="h-full bg-indigo-500 transition-all duration-300" style={{ width: `${progress}%` }}></div>
                                                </div>
                                            </div>
                                        ) : audioUrl ? (
                                            <div className="py-6 flex flex-col items-center animate-fade-in">
                                                <div className="w-24 h-24 rounded-full bg-indigo-500/10 flex items-center justify-center mb-4 text-indigo-500 relative">
                                                    <div className={`absolute inset-0 rounded-full border-2 border-indigo-500 ${isPlaying ? 'animate-ping opacity-20' : 'opacity-0'}`}></div>
                                                    <FileAudio size={40} />
                                                </div>
                                                <h3 className="text-lg font-bold mb-1">Ready to play</h3>
                                                <p className="text-sm opacity-60 mb-6">{VOICES.find(v=>v.name === voice)?.style} Voice • {contextMode}</p>
                                                
                                                <audio 
                                                    ref={audioRef} 
                                                    src={audioUrl} 
                                                    onEnded={() => setIsPlaying(false)}
                                                    onPlay={() => setIsPlaying(true)}
                                                    onPause={() => setIsPlaying(false)}
                                                    className="hidden"
                                                />
                                                
                                                <div className="flex gap-4 w-full justify-center">
                                                    <button 
                                                        onClick={togglePlayback}
                                                        className="flex-1 max-w-[140px] bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition shadow-lg shadow-indigo-500/20"
                                                    >
                                                        {isPlaying ? <Pause size={18} /> : <Play size={18} />}
                                                        {isPlaying ? 'Pause' : 'Play'}
                                                    </button>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => handleDownload('wav')} className="p-2 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700" title="Download WAV"><Download size={20} /></button>
                                                        <button onClick={() => handleDownload('srt')} className="p-2 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700" title="Export SRT"><FileText size={20} /></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="py-12 flex flex-col items-center text-slate-400">
                                                <Mic size={48} className="mb-4 opacity-50" />
                                                <p>Ready to generate voice over</p>
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-4 bg-slate-50 dark:bg-slate-900/50">
                                        <button
                                            onClick={handleGenerate}
                                            disabled={loading || !text.trim()}
                                            className={`w-full py-3 rounded-lg font-bold text-lg flex items-center justify-center gap-2 transition-all transform hover:scale-[1.01] active:scale-[0.99]
                                                ${loading || !text.trim() ? 'bg-slate-300 dark:bg-slate-700 text-slate-500 cursor-not-allowed' : 'bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white shadow-lg shadow-indigo-500/25'}`}
                                        >
                                            {loading ? 'Processing...' : <><RefreshCw size={20} /> Generate Voice Over</>}
                                        </button>
                                    </div>
                                </div>

                                {showHistory && (
                                    <div className={`rounded-xl border overflow-hidden animate-slide-up ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'}`}>
                                        <div className="p-4 border-b border-inherit bg-slate-50 dark:bg-slate-900/50 flex justify-between items-center">
                                            <h3 className="font-semibold flex items-center gap-2"><History size={16}/> Recent Projects</h3>
                                        </div>
                                        <div className="max-h-[300px] overflow-y-auto p-2">
                                            {history.length === 0 ? <p className="text-center text-sm opacity-50 py-8">No history.</p> : history.map(item => (
                                                <div key={item.id} className="p-3 mb-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700/50 group transition flex justify-between items-start cursor-pointer" onClick={() => loadFromHistory(item)}>
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2 mb-1"><span className="text-xs font-bold text-indigo-500 uppercase">{item.voice}</span><span className="text-xs opacity-50">{item.mode}</span></div>
                                                        <p className="text-sm line-clamp-2 opacity-80">{item.text}</p>
                                                    </div>
                                                    <button onClick={(e) => { e.stopPropagation(); deleteFromHistory(item.id); }} className="p-1 text-slate-400 hover:text-red-500 opacity-0 group-hover:opacity-100"><Trash2 size={16} /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>
                    <footer className="text-center py-6 text-xs opacity-30">Powered by Google Gemini 2.5 Flash TTS</footer>
                </div>
            );
        }

        // ------------------------------------------------------------------
        // 3. MOUNT APPLICATION
        // ------------------------------------------------------------------
        const root = createRoot(document.getElementById('root'));
        root.render(<GeminiVoiceStudio />);
    </script>
</body>
</html>

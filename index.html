<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Lintas Nusa AI Studio — Modular Creative Builder v8.5</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
        .step-container { border-left: 3px solid #e5e7eb; padding-left: 24px; position: relative; transition: all .4s; }
        .step-container.active { border-color: #2563eb; }
        .step-container.done { border-color: #16a34a; opacity: .7; }
        .step-container.pending { opacity: .4; pointer-events: none; }
        .step-number { position: absolute; left: -14px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #64748b; }
        .active .step-number { background: #2563eb; color: white; }
        .done .step-number { background: #16a34a; color: white; }
        .code-raw { background: #0f172a; color: #38bdf8; font-family: monospace; border-radius: 12px; padding: 16px; font-size: 11px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; border: 1px solid #1e293b; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp .4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STYLE_FAMILIES = {
            "Anime & Japanese Animation": [
                "Modern Cinematic Anime (Makoto Shinkai Style)", "Studio Ghibli Nostalgic Style", "90s Retro Hand-Drawn Anime", 
                "Shonen Action Anime", "Cyberpunk Future Anime", "Samurai Historical Ink Style", "Dark Fantasy Seinen",
                "Slice of Life Soft Pastel", "Mythological Folklore Anime", "Post-Apocalyptic Anime"
            ],
            "Stylized 3D Animation": [
                "Disney-Pixar Style 3D", "Spider-Verse Stylized Comic 3D", "Soft Cartoon 3D", "Toy-Scale Miniature World",
                "DreamWorks-Inspired Fantasy", "Children Storybook 3D", "Hyper-Realistic CGI Movie", "Low Poly Artistic 3D",
                "Isometric Diorama 3D", "Unreal Engine 5 Concept"
            ],
            "Handmade & Craft Motion": [
                "Plasticine Claymation Style", "Felted Wool Stop-Motion", "Handcrafted Paper Cutout", "Origami Paper World",
                "Pop-up Book Paper Craft", "Wooden Puppet Animation", "Sand Art Animation", "Embroidery Stitch Art",
                "Knitted Fabric Texture", "Bronze Sculpture Motion"
            ],
            "Illustrated Narratives": [
                "Watercolor Storybook Illustration", "Crayon & Chalkboard Story", "Ink Wash & Line Art", "Oil Painting Masterpiece",
                "Gouache Flat Illustration", "Charcoal Sketch Art", "Vintage Lithography", "Art Nouveau Floral",
                "Bauhaus Geometric Art", "Stained Glass Cathedral"
            ],
            "Cinematic & Experimental": [
                "Film Noir Black & White", "Glitch Art Digital Distortion", "Infrared Dreamscape Style", "Cybernetic Biotech Visuals",
                "Technicolor 1950s Cinematic", "Vaporwave 80s Aesthetic", "Minimalist Silhouette", "Double Exposure Ethereal",
                "Kaleidoscopic Surrealism", "Ethereal Cosmic Nebula"
            ]
        };

        const MOODS = ["Imut / Cute", "Hangat / Cozy", "Melankolis", "Reflektif", "Dark", "Horror", "Misterius", "Heroik", "Magis", "Epik"];

        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => { window.lucide?.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const App = () => {
            const apiKey = ""; 

            // --- STATE ---
            const [step, setStep] = useState(1);
            const [synopsis, setSynopsis] = useState("");
            const [styleFamily, setStyleFamily] = useState("Anime & Japanese Animation");
            const [subStyle, setSubStyle] = useState("Modern Cinematic Anime (Makoto Shinkai Style)");
            const [mood, setMood] = useState("Hangat / Cozy");
            const [useCharacter, setUseCharacter] = useState(true);
            const [characters, setCharacters] = useState([{ id: Date.now(), name: '', role: '' }]);
            const [numScenes, setNumScenes] = useState(4);
            
            const [isProducing, setIsProducing] = useState(false);
            const [showResult, setShowResult] = useState(false);
            const [generatedData, setGeneratedData] = useState(null);
            const [copiedIndex, setCopiedIndex] = useState(null);

            useEffect(() => { if (styleFamily) setSubStyle(STYLE_FAMILIES[styleFamily][0]); }, [styleFamily]);

            const handleProduce = async () => {
                setIsProducing(true);
                const charDNA = useCharacter ? characters.map(c => `${c.name} (${c.role})`).join(", ") : "Narrative inhabitants.";
                
                const systemPrompt = `
You are the Lead Storyboard & Production Prompt Generator for "Lintas Nusa AI Studio".
MANDATORY WORKFLOW: STORYBOARD MODE -> TEXT TO IMAGE -> IMAGE TO VIDEO.

STORYBOARD RULES:
- Continuous narrative with cause-and-effect link between scenes.
- Every scene must change the situation or information.
- World Rule: FULL-FRAME, berlapis (FG/MG/BG), and alive. No studio/product shots.

PRODUCTION RULES:
- T2I: 8-12 sentences English prompt. Describe COMPLETE WORLD beyond frame. NO TEXT/Letters. Ratio 9:16.
- I2V: FIXED REFERENCE. Micro-motion only (blink, breathe, sway). No element/costume changes.
- VO: Indonesian, emotional, 12-15 words per scene.

OUTPUT FORMAT (STRICT JSON ONLY):
{
  "project_title": "Title",
  "style_preset": "${subStyle}",
  "storyboard_mode": {
    "goal": "emotional goal",
    "arc": "causal story arc",
    "logic": [ { "scene": number, "purpose": "function", "world": "FG/MG/BG desc" } ]
  },
  "production_mode": [
    { "t2i": "RAW_PROMPT", "i2v": "RAW_PROMPT", "vo": "RAW_VO" }
  ]
}
DILARANG menambahkan penjelasan di luar JSON. DILARANG menyertakan label seperti "Text-to-image" di dalam value string.
`;

                const userQuery = `Synopsis: ${synopsis}. Characters: ${charDNA}. Style: ${subStyle}. Mood: ${mood}. Number of Scenes: ${numScenes}. Build a complete causal world.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });
                    const result = await response.json();
                    const data = JSON.parse(result.candidates[0].content.parts[0].text);
                    setGeneratedData(data);
                    setIsProducing(false);
                    setShowResult(true);
                } catch (e) {
                    setIsProducing(false);
                    alert("Error dalam sinkronisasi AI. Periksa koneksi.");
                }
            };

            const copyToClipboard = (text, index) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                setCopiedIndex(index);
                setTimeout(() => setCopiedIndex(null), 2000);
            };

            const getStepClass = (s) => {
                if (step === s) return "step-container active animate-fade-up";
                if (step > s) return "step-container done";
                return "step-container pending";
            };

            return (
                <div className="min-h-screen pb-24">
                    <header className="bg-white/90 backdrop-blur-lg border-b p-5 sticky top-0 z-50 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-2xl shadow-lg text-white"><Icon name="star" /></div>
                            <div>
                                <h1 className="font-black text-xl tracking-tight text-slate-900 uppercase leading-none">Lintas Nusa <span className="text-blue-600">AI Animasi Studio</span></h1>
                                <p className="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase mt-1">Modular Creative Builder v8.5</p>
                            </div>
                        </div>
                        <div className="bg-blue-50 px-4 py-1.5 rounded-full border border-blue-100 flex items-center gap-2 text-blue-600">
                            <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                            <span className="text-[9px] font-black uppercase tracking-widest">Logic Mode Active</span>
                        </div>
                    </header>

                    <main className="max-w-2xl mx-auto p-8 space-y-12">
                        {/* STEP 1 */}
                        <div className={getStepClass(1)}>
                            <div className="step-number">1</div>
                            <h3 className="font-black text-xs uppercase tracking-widest text-slate-800 mb-4">1. Story Core</h3>
                            <textarea value={synopsis} onChange={e => setSynopsis(e.target.value)} placeholder="Tuliskan jalan cerita atau plot utama di sini..." className="w-full p-4 border-2 border-slate-100 rounded-2xl h-32 text-sm font-medium outline-none focus:border-blue-500 transition-all bg-white shadow-sm" />
                            {step === 1 && synopsis && <button onClick={()=>setStep(2)} className="mt-4 bg-blue-600 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg">Lanjut</button>}
                        </div>

                        {/* STEP 2 */}
                        {step >= 2 && (
                            <div className={getStepClass(2)}>
                                <div className="step-number">2</div>
                                <h3 className="font-black text-xs uppercase tracking-widest text-slate-800 mb-4">2. Visual Style & Mood</h3>
                                <div className="space-y-3">
                                    <select value={styleFamily} onChange={e=>setStyleFamily(e.target.value)} className="w-full bg-white border-2 border-slate-100 rounded-2xl p-4 font-bold text-sm outline-none focus:border-blue-500 shadow-sm transition-all">
                                        {Object.keys(STYLE_FAMILIES).map(f => <option key={f}>{f}</option>)}
                                    </select>
                                    <select value={subStyle} onChange={e=>setSubStyle(e.target.value)} className="w-full bg-white border-2 border-slate-100 rounded-2xl p-4 font-bold text-sm outline-none focus:border-blue-500 shadow-sm transition-all">
                                        {STYLE_FAMILIES[styleFamily].map(s => <option key={s}>{s}</option>)}
                                    </select>
                                    <select value={mood} onChange={e=>setMood(e.target.value)} className="w-full bg-white border-2 border-slate-100 rounded-2xl p-4 font-bold text-sm outline-none focus:border-blue-500 shadow-sm transition-all">
                                        <option value="">Pilih Mood...</option>
                                        {MOODS.map(m => <option key={m}>{m}</option>)}
                                    </select>
                                </div>
                                {step === 2 && <button onClick={()=>setStep(3)} className="mt-4 bg-blue-600 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg">Lanjut</button>}
                            </div>
                        )}

                        {/* STEP 3 */}
                        {step >= 3 && (
                            <div className={getStepClass(3)}>
                                <div className="step-number">3</div>
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-black text-xs uppercase tracking-widest text-slate-800">3. Identity Mode</h3>
                                    <button onClick={() => setUseCharacter(!useCharacter)} className={`w-10 h-5 rounded-full relative transition-all border ${useCharacter ? 'bg-blue-600 border-blue-700' : 'bg-slate-200 border-slate-300'}`}>
                                        <div className={`absolute top-0.5 w-3.5 h-3.5 bg-white rounded-full shadow-sm transition-all ${useCharacter ? 'left-5.5' : 'left-0.5'}`} />
                                    </button>
                                </div>
                                {useCharacter ? (
                                    <div className="space-y-3 animate-fade-up">
                                        {characters.map((c,i)=>(
                                            <div key={c.id} className="grid grid-cols-2 gap-2">
                                                <input placeholder="NAMA TOKOH" value={c.name} onChange={e=>{const copy=[...characters]; copy[i].name=e.target.value; setCharacters(copy);}} className="p-3 border-2 border-slate-100 rounded-xl text-xs font-bold focus:border-blue-500 outline-none shadow-sm" />
                                                <input placeholder="PERAN (PROTAGONIS/DLL)" value={c.role} onChange={e=>{const copy=[...characters]; copy[i].role=e.target.value; setCharacters(copy);}} className="p-3 border-2 border-slate-100 rounded-xl text-xs font-bold focus:border-blue-500 outline-none shadow-sm" />
                                            </div>
                                        ))}
                                        <button onClick={()=>setCharacters([...characters, {id:Date.now(), name:'', role:''}])} className="text-[9px] font-black uppercase text-blue-600 px-3">+ Tambah Karakter</button>
                                    </div>
                                ) : <div className="p-8 border-2 border-dashed rounded-[2rem] text-center text-[10px] font-black uppercase text-slate-400 bg-slate-50">Storytelling Mode: Atmospheric Narrator</div>}
                                {step === 3 && <button onClick={()=>setStep(4)} className="mt-4 bg-blue-600 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg">Lanjut</button>}
                            </div>
                        )}

                        {/* STEP 4 */}
                        {step >= 4 && (
                            <div className={getStepClass(4)}>
                                <div className="step-number">4</div>
                                <h3 className="font-black text-xs uppercase tracking-widest text-slate-800 mb-4">4. Production Flow</h3>
                                <div className="flex gap-2">
                                    {[3, 4, 5, 8, 10].map(n => (
                                        <button key={n} onClick={()=>setNumScenes(n)} className={`flex-1 py-3 rounded-xl border-2 font-black text-xs transition-all ${numScenes === n ? 'bg-blue-600 border-blue-700 text-white shadow-md' : 'bg-white border-slate-100 text-slate-400 hover:border-blue-300'}`}>{n} Scene</button>
                                    ))}
                                </div>
                                {step === 4 && <button onClick={()=>setStep(5)} className="mt-4 bg-blue-600 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg">Siapkan Produksi</button>}
                            </div>
                        )}

                        {/* STEP 5 */}
                        {step >= 5 && (
                            <div className={getStepClass(5)}>
                                <div className="step-number">5</div>
                                <h3 className="font-black text-xs uppercase tracking-widest text-slate-800 mb-4">5. Final Execution</h3>
                                <button onClick={handleProduce} disabled={isProducing} className={`w-full py-6 rounded-[2rem] border border-blue-700 font-black uppercase tracking-[0.2em] text-sm transition-all shadow-2xl ${isProducing ? 'bg-slate-100 text-slate-400 border-slate-200' : 'bg-blue-600 text-white hover:bg-blue-700 active:scale-95 shadow-blue-200'}`}>
                                    {isProducing ? "Assembling Causal World..." : "Mulai Produksi Kreatif"}
                                </button>
                            </div>
                        )}
                    </main>

                    {/* MODAL RESULT */}
                    {showResult && generatedData && (
                        <div className="fixed inset-0 z-[100] bg-slate-900/60 flex items-center justify-center p-4 backdrop-blur-xl overflow-y-auto pt-20 pb-10">
                            <div className="bg-white border border-slate-200 rounded-[3rem] w-full max-w-2xl my-auto p-8 space-y-8 shadow-2xl relative animate-fade-up">
                                <button onClick={() => setShowResult(false)} className="absolute top-6 right-6 p-2 bg-slate-100 text-slate-400 rounded-full hover:bg-red-50 hover:text-red-500 transition-all"><Icon name="x" size={24} /></button>
                                <div className="text-center space-y-1">
                                    <h3 className="font-black text-2xl text-slate-900 uppercase tracking-tighter leading-none">{generatedData.project_title}</h3>
                                    <p className="text-blue-600 text-[10px] font-black uppercase tracking-[0.2em]">Preset: {generatedData.style_preset}</p>
                                </div>
                                <div className="space-y-8 max-h-[60vh] overflow-y-auto pr-4 custom-scrollbar">
                                    <div className="bg-blue-50/50 border border-blue-100 p-6 rounded-3xl space-y-4 text-[10px] font-bold uppercase text-blue-600 leading-relaxed shadow-sm">
                                        <div className="flex items-center gap-2 border-b border-blue-100 pb-2 mb-2"><Icon name="layers" size={14}/><p>STORYBOARD STRATEGY</p></div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="space-y-1"><p className="opacity-50 tracking-widest">Goal</p><p className="bg-white p-3 rounded-xl border border-blue-100">{generatedData.storyboard_mode.goal}</p></div>
                                            <div className="space-y-1"><p className="opacity-50 tracking-widest">Causal Arc</p><p className="bg-white p-3 rounded-xl border border-blue-100">{generatedData.storyboard_mode.arc}</p></div>
                                        </div>
                                    </div>
                                    <div className="space-y-12">
                                        {generatedData.production_mode.map((scene, idx) => (
                                            <div key={idx} className="bg-slate-50 border border-slate-100 rounded-[2.5rem] p-8 space-y-8 shadow-sm">
                                                <div className="flex flex-col gap-3">
                                                    <div className="flex items-center justify-between">
                                                        <span className="bg-blue-600 text-white w-fit px-6 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-md">SCENE {idx + 1}</span>
                                                        <div className="flex items-center gap-1.5 text-slate-400"><Icon name="clock" size={12}/><span className="text-[9px] font-bold uppercase">4-6s</span></div>
                                                    </div>
                                                    <p className="text-[11px] font-black text-slate-900 uppercase tracking-tight py-2 border-b border-slate-200 leading-relaxed">{generatedData.storyboard_mode.logic[idx]?.purpose}</p>
                                                    <div className="p-4 bg-white rounded-xl border border-slate-200 shadow-sm">
                                                        <p className="text-[8px] font-black text-blue-600 uppercase mb-2 tracking-widest underline decoration-blue-200 decoration-2">World Architecture</p>
                                                        <p className="text-[10px] font-bold text-slate-500 italic leading-relaxed">{generatedData.storyboard_mode.logic[idx]?.world}</p>
                                                    </div>
                                                </div>
                                                <div className="space-y-6 pt-4 border-t border-slate-200 border-dashed">
                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-center text-[10px] font-black text-blue-600 px-1 uppercase tracking-widest"><div className="flex gap-2 items-center"><Icon name="image" size={14}/> COMPLETE WORLD PROMPT</div><button onClick={() => copyToClipboard(scene.t2i, `${idx}-t2i`)} className="hover:text-blue-800 uppercase text-[9px] bg-white border border-slate-200 px-2 py-1 rounded-md shadow-sm">{copiedIndex === `${idx}-t2i` ? "Tersalin" : "Salin"}</button></div>
                                                        <div className="code-raw">{scene.t2i}</div>
                                                    </div>
                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-center text-[10px] font-black text-green-600 px-1 uppercase tracking-widest"><div className="flex gap-2 items-center"><Icon name="video" size={14}/> MICRO-MOTION PROMPT</div><button onClick={() => copyToClipboard(scene.i2v, `${idx}-i2v`)} className="hover:text-green-800 uppercase text-[9px] bg-white border border-slate-200 px-2 py-1 rounded-md shadow-sm">{copiedIndex === `${idx}-i2v` ? "Tersalin" : "Salin"}</button></div>
                                                        <div className="code-raw" style={{color: '#4ade80'}}>{scene.i2v}</div>
                                                    </div>
                                                    <div className="space-y-2">
                                                        <div className="flex justify-between items-center text-[10px] font-black text-amber-600 px-1 uppercase tracking-widest"><div className="flex gap-2 items-center"><Icon name="mic" size={14}/> VOICE OVER</div><button onClick={() => copyToClipboard(scene.vo, `${idx}-vo`)} className="hover:text-amber-800 uppercase text-[9px] bg-white border border-slate-200 px-2 py-1 rounded-md shadow-sm">{copiedIndex === `${idx}-vo` ? "Tersalin" : "Salin"}</button></div>
                                                        <div className="code-raw" style={{color: '#fbbf24'}}>{scene.vo}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-slate-900 p-6 rounded-[2.5rem] flex items-center gap-4 text-white shadow-xl text-center">
                                    <p className="text-[10px] font-bold opacity-80 leading-relaxed uppercase tracking-widest w-full">Gunakan T2I Prompt untuk membangun dunia visual utuh (8-12 kalimat), lalu gerakkan atmosfer dengan I2V Prompt tanpa mengubah elemen tetap gambar.</p>
                                </div>
                                <p className="text-center text-[8px] font-bold text-slate-300 uppercase tracking-[0.6em] py-2">END OUTPUT</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

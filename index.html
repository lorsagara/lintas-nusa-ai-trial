<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lintas Nusa AI Studio — Modular Creative Builder</title>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>

<style>
body { font-family: 'Plus Jakarta Sans', sans-serif; }
.code {
  background:#0f172a;
  color:#38bdf8;
  padding:16px;
  border-radius:12px;
  font-size:11px;
  white-space:pre-wrap;
  line-height:1.6;
}
.step {
  border-left:4px solid #e5e7eb;
  padding-left:16px;
}
.step.active { border-color:#2563eb; }
.step.done { border-color:#16a34a; }
</style>
</head>

<body class="bg-slate-50">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

/* ================= TRIAL CONFIG ================= */
const TRIAL_DAYS = 3;

/* ================= CONFIG ================= */
const STYLE_FAMILIES = {
  "Anime & Japanese-Inspired Animation": [
    "Modern Cinematic Anime",
    "Classic Ghibli-Inspired Anime",
    "Shonen Action Anime",
    "Dark Fantasy Anime"
  ],
  "Western Stylized 3D Animation": [
    "Pixar-Style Stylized 3D",
    "DreamWorks-Inspired 3D",
    "Soft Cartoon 3D"
  ],
  "Handmade & Craft Animation": [
    "Claymation",
    "Felt & Fabric Stop Motion",
    "Paper Cutout"
  ],
  "Illustrated & Art-Driven Animation": [
    "Watercolor Storybook",
    "Crayon Hand-Drawn",
    "Ink Line Animation"
  ]
};

const MOODS = [
  "Imut / Cute","Hangat / Cozy","Melankolis","Reflektif",
  "Dark","Horror","Misterius","Heroik","Magis","Epik"
];

const App = () => {

/* ================= STATE ================= */
const [step, setStep] = useState(1);
const [synopsis, setSynopsis] = useState("");
const [styleFamily, setStyleFamily] = useState("");
const [subStyle, setSubStyle] = useState("");
const [mood, setMood] = useState("");

const [useCharacter, setUseCharacter] = useState(true);
const [character, setCharacter] = useState({ name:"", role:"" });

const [numScenes, setNumScenes] = useState(4);
const [payload, setPayload] = useState(null);
const [history, setHistory] = useState([]);

/* ================= TRIAL STATE ================= */
const [trialExpired, setTrialExpired] = useState(false);
const [trialRemaining, setTrialRemaining] = useState(null);

/* ================= INIT ================= */
useEffect(() => {
  // trial
  let start = localStorage.getItem("LN_TRIAL_START");
  if (!start) {
    start = Date.now();
    localStorage.setItem("LN_TRIAL_START", start);
  }
  const elapsed = Date.now() - Number(start);
  const max = TRIAL_DAYS * 24 * 60 * 60 * 1000;

  if (elapsed > max) {
    setTrialExpired(true);
    setTrialRemaining(0);
  } else {
    setTrialRemaining(Math.ceil((max - elapsed) / (24 * 60 * 60 * 1000)));
  }

  // history
  const saved = JSON.parse(localStorage.getItem("LN_STORY_HISTORY") || "[]");
  setHistory(saved);
}, []);

/* ================= BUILD PAYLOAD ================= */
const buildPayload = () => {
  if (trialExpired) return;

  const narrationMode = useCharacter
    ? "character_driven_storytelling"
    : "omniscient_storyteller";

  const data = {
    project_type: "Storyboard & Animation Prompt",
    story_core: { synopsis },

    style: { family: styleFamily, sub_style: subStyle, mood },

    narration_mode: narrationMode,

    voice_over_rules: {
      scope: "per_scene",
      duration: "≈6 seconds per scene",
      word_limit: "max 8 words per scene",
      mandatory: [
        "Voice over must advance the story",
        "Voice over must match the narrative purpose of the scene",
        "Voice over must connect logically to previous and next scene"
      ],
      forbidden: [
        "generic statements",
        "visual description",
        "standalone sentences"
      ]
    },

    ...(useCharacter && {
      character_sheet: {
        ...character,
        note: "Character perspective may influence narration tone, not description."
      }
    }),

    storyboard: {
      number_of_scenes: numScenes,
      scene_duration: "6 seconds each",
      continuity_required: true
    },

    output_contract: {
      text_to_image: "Full-frame dense living world per scene",
      image_to_video: "Micro-motion only",
      voice_over: "Storytelling VO per scene, max 8 words"
    }
  };

  setPayload(data);

  const entry = {
    id: Date.now(),
    title: synopsis.split(" ").slice(0, 5).join(" ") + "...",
    created_at: new Date().toLocaleString(),
    payload: data
  };

  const updated = [entry, ...history];
  setHistory(updated);
  localStorage.setItem("LN_STORY_HISTORY", JSON.stringify(updated));
};

/* ================= UI ================= */
return (
<div className="max-w-5xl mx-auto p-8 space-y-10">

<p className="text-xs text-slate-400">
{trialExpired
  ? "🔒 Trial berakhir"
  : `🟡 Trial — ${trialRemaining} hari tersisa`}
</p>

<h1 className="text-3xl font-black">Lintas Nusa AI Studio</h1>
<p className="text-slate-500 text-sm">
Storyboard-Driven Storytelling • ≤8 Words per Scene
</p>

{/* STEP 1 */}
<div className={`step ${step===1?'active':'done'}`}>
<h2 className="font-black">1. Story Core</h2>
<textarea className="w-full p-3 border rounded"
placeholder="Ringkasan cerita atau pesan utama..."
value={synopsis}
onChange={e=>setSynopsis(e.target.value)}
/>
<button disabled={!synopsis}
onClick={()=>setStep(2)}
className="mt-3 bg-blue-600 text-white px-4 py-2 rounded font-bold">
Lanjut
</button>
</div>

{/* STEP 2 */}
{step>=2 && (
<div className={`step ${step===2?'active':'done'}`}>
<h2 className="font-black">2. Style & Mood</h2>

<select className="w-full p-3 border rounded mb-2"
value={styleFamily}
onChange={e=>setStyleFamily(e.target.value)}>
<option value="">Pilih Style Family</option>
{Object.keys(STYLE_FAMILIES).map(f=>(
<option key={f} value={f}>{f}</option>
))}
</select>

{styleFamily && (
<select className="w-full p-3 border rounded mb-2"
value={subStyle}
onChange={e=>setSubStyle(e.target.value)}>
<option value="">Pilih Sub-Style</option>
{STYLE_FAMILIES[styleFamily].map(s=>(
<option key={s} value={s}>{s}</option>
))}
</select>
)}

<select className="w-full p-3 border rounded"
value={mood}
onChange={e=>setMood(e.target.value)}>
<option value="">Pilih Mood</option>
{MOODS.map(m=>(
<option key={m} value={m}>{m}</option>
))}
</select>

<button disabled={!subStyle || !mood}
onClick={()=>setStep(3)}
className="mt-3 bg-blue-600 text-white px-4 py-2 rounded font-bold">
Lanjut
</button>
</div>
)}

{/* STEP 3 */}
{step>=3 && (
<div className={`step ${step===3?'active':'done'}`}>
<h2 className="font-black">3. Character Mode</h2>

<label className="flex items-center gap-3 mb-3">
<input type="checkbox"
checked={useCharacter}
onChange={e=>setUseCharacter(e.target.checked)}
/>
<span className="font-bold text-sm">Gunakan Karakter</span>
</label>

{useCharacter && (
<input className="w-full p-3 border rounded"
placeholder="Nama karakter"
value={character.name}
onChange={e=>setCharacter({...character,name:e.target.value})}/>
)}

<button disabled={useCharacter && !character.name}
onClick={()=>setStep(4)}
className="mt-3 bg-blue-600 text-white px-4 py-2 rounded font-bold">
Lanjut
</button>
</div>
)}

{/* STEP 4 */}
{step>=4 && (
<div className={`step ${step===4?'active':'done'}`}>
<h2 className="font-black">4. Storyboard Flow</h2>
<select
  className="w-full p-3 border rounded"
  value={numScenes}
  onChange={e=>setNumScenes(Number(e.target.value))}
>
{[3,4,5,6].map(n=>(
<option key={n} value={n}>{n} Scene</option>
))}
</select>

<button onClick={()=>setStep(5)}
className="mt-3 bg-blue-600 text-white px-4 py-2 rounded font-bold">
Lanjut
</button>
</div>
)}

{/* STEP 5 */}
{step>=5 && (
<div className="step active">
<h2 className="font-black">5. Build Payload</h2>

<button
onClick={buildPayload}
disabled={trialExpired}
className={`px-6 py-3 rounded font-black ${
  trialExpired
    ? "bg-gray-300 text-gray-500 cursor-not-allowed"
    : "bg-green-600 text-white"
}`}>
Build Payload
</button>

{payload && (
<pre className="code mt-4">
{JSON.stringify(payload, null, 2)}
</pre>
)}
</div>
)}

</div>
);
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lintas Nusa AI Studio</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
        .card-gradient { background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%); }
        .code-block { background: #0f172a; color: #38bdf8; font-family: 'Courier New', monospace; border-radius: 12px; padding: 16px; font-size: 11px; line-height: 1.6; border: 1px solid #1e293b; white-space: pre-wrap; word-break: break-word; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-up { animation: fadeUp 0.4s ease-out forwards; }
    </style>
</head>

<body class="bg-[#F8FAFC] text-slate-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const Icon = ({ name, className = "w-5 h-5", size }) => {
    useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
    return <i data-lucide={name} className={className} style={size ? {width: size, height: size} : {}}></i>;
};

const App = () => {

    /* ================= TRIAL CONFIG ================= */
    const TRIAL_DAYS = 3;
    const [trialExpired, setTrialExpired] = useState(false);
    const [trialRemaining, setTrialRemaining] = useState(null);

    useEffect(() => {
        let start = localStorage.getItem("LN_TRIAL_START");
        if (!start) {
            start = Date.now();
            localStorage.setItem("LN_TRIAL_START", start);
        }

        const elapsed = Date.now() - Number(start);
        const max = TRIAL_DAYS * 24 * 60 * 60 * 1000;

        if (elapsed > max) {
            setTrialExpired(true);
            setTrialRemaining(0);
        } else {
            setTrialRemaining(Math.ceil((max - elapsed) / (24 * 60 * 60 * 1000)));
        }
    }, []);

    /* ================= ORIGINAL STATE ================= */
    const [isProducing, setIsProducing] = useState(false);
    const [synopsis, setSynopsis] = useState("");

    const handleProduce = () => {
        if (trialExpired) return;
        setIsProducing(true);
        setTimeout(() => setIsProducing(false), 2000);
    };

    return (
        <div className="min-h-screen">

            {/* HEADER — ASLI + TRIAL BADGE */}
            <header className="bg-white/90 backdrop-blur-lg border-b border-slate-200 p-5 sticky top-0 z-50 flex justify-between items-center shadow-sm">
                <div className="flex items-center gap-3">
                    <div className="bg-blue-600 p-2.5 rounded-2xl shadow-lg text-white">
                        <Icon name="star" />
                    </div>
                    <div>
                        <h1 className="font-black text-xl uppercase leading-none">
                            Lintas Nusa <span className="text-blue-600">AI</span>
                        </h1>
                        <p className="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase mt-1">
                            Animasi Studio • World Architect
                        </p>
                    </div>
                </div>

                <div className="bg-blue-50 px-4 py-1.5 rounded-full border border-blue-100 flex items-center gap-2">
                    <div className={`w-2 h-2 rounded-full ${trialExpired ? 'bg-red-500' : 'bg-green-500'} animate-pulse`}></div>
                    <span className="text-[9px] font-black text-blue-600 uppercase tracking-widest">
                        {trialExpired ? "Trial Expired" : `Trial • ${trialRemaining} Hari`}
                    </span>
                </div>
            </header>

            {/* MAIN — ASLI */}
            <main className="max-w-2xl mx-auto p-6 space-y-8">
                <textarea
                    value={synopsis}
                    onChange={e => setSynopsis(e.target.value)}
                    placeholder="Tuliskan jalan cerita atau legenda Anda di sini..."
                    className="w-full bg-white border border-slate-200 rounded-2xl p-4 h-32"
                />

                {/* TOMBOL ASLI — DIKUNCI JIKA TRIAL HABIS */}
                <button
                    onClick={handleProduce}
                    disabled={trialExpired || !synopsis || isProducing}
                    className={`w-full py-6 rounded-[2.5rem] border font-black uppercase tracking-[0.2em] text-sm transition-all
                        ${
                            trialExpired
                                ? 'bg-slate-200 text-slate-400 border-slate-300 cursor-not-allowed'
                                : (!synopsis || isProducing)
                                    ? 'bg-slate-100 text-slate-400 border-slate-200'
                                    : 'bg-blue-600 text-white border-blue-700 shadow-xl hover:bg-blue-700'
                        }`}
                >
                    {trialExpired ? "Trial Berakhir" : "Mulai Produksi Kreatif"}
                </button>
            </main>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lintas Nusa AI Studio — Modular Creative Builder v8.0</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3B82F6; }
        
        .step-container { border-left: 3px solid #e5e7eb; padding-left: 24px; position: relative; transition: all 0.4s ease; }
        .step-container.active { border-color: #2563eb; opacity: 1; }
        .step-container.done { border-color: #16a34a; opacity: 0.7; }
        .step-container.pending { opacity: 0.4; pointer-events: none; }
        
        .step-number { position: absolute; left: -14px; top: 0; width: 24px; height: 24px; border-radius: 50%; background: #e5e7eb; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #64748b; transition: all 0.4s ease; }
        .active .step-number { background: #2563eb; color: white; transform: scale(1.1); box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
        .done .step-number { background: #16a34a; color: white; }

        .code-raw { background: #0f172a; color: #38bdf8; font-family: 'Courier New', monospace; border-radius: 12px; padding: 16px; font-size: 11px; line-height: 1.6; border: 1px solid #1e293b; white-space: pre-wrap; word-break: break-word; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STYLE_FAMILIES = {
            "Anime & Japanese Animation": [
                "Modern Cinematic Anime (Makoto Shinkai Style)", "Studio Ghibli Nostalgic Style", "90s Retro Hand-Drawn Anime", 
                "Shonen Action Anime", "Cyberpunk Future Anime", "Samurai Historical Ink Style", "Dark Fantasy Seinen",
                "Slice of Life Soft Pastel", "Mythological Folklore Anime", "Post-Apocalyptic Anime"
            ],
            "Stylized 3D Animation": [
                "Disney-Pixar Style 3D", "Spider-Verse Stylized Comic 3D", "Soft Cartoon 3D", "Toy-Scale Miniature World",
                "DreamWorks-Inspired Fantasy", "Children Storybook 3D", "Hyper-Realistic CGI Movie", "Low Poly Artistic 3D",
                "Isometric Diorama 3D", "Unreal Engine 5 Concept"
            ],
            "Handmade & Craft Motion": [
                "Plasticine Claymation Style", "Felted Wool Stop-Motion", "Handcrafted Paper Cutout", "Origami Paper World",
                "Pop-up Book Paper Craft", "Wooden Puppet Animation", "Sand Art Animation", "Embroidery Stitch Art",
                "Knitted Fabric Texture", "Bronze Sculpture Motion"
            ],
            "Illustrated Narratives": [
                "Watercolor Storybook Illustration", "Crayon & Chalkboard Story", "Ink Wash & Line Art", "Oil Painting Masterpiece",
                "Gouache Flat Illustration", "Charcoal Sketch Art", "Vintage Lithography", "Art Nouveau Floral",
                "Bauhaus Geometric Art", "Stained Glass Cathedral"
            ],
            "Cinematic & Experimental": [
                "Film Noir Black & White", "Glitch Art Digital Distortion", "Infrared Dreamscape Style", "Cybernetic Biotech Visuals",
                "Technicolor 1950s Cinematic", "Vaporwave 80s Aesthetic", "Minimalist Silhouette", "Double Exposure Ethereal",
                "Kaleidoscopic Surrealism", "Ethereal Cosmic Nebula"
            ]
        };

        const MOODS = ["Imut / Cute", "Hangat / Cozy", "Melankolis", "Reflektif", "Dark", "Horror", "Misterius", "Heroik", "Magis", "Epik"];

        const Icon = ({ name, className = "w-5 h-5", size }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={size ? {width: size, height: size} : {}}></i>;
        };

        const App = () => {
            const apiKey = "";

            const [step, setStep] = useState(1);
            const [synopsis, setSynopsis] = useState("");
            const [styleFamily, setStyleFamily] = useState("Anime & Japanese Animation");
            const [subStyle, setSubStyle] = useState("Modern Cinematic Anime (Makoto Shinkai Style)");
            const [mood, setMood] = useState("Hangat / Cozy");
            const [useCharacter, setUseCharacter] = useState(true);
            const [character, setCharacter] = useState({ name: '', role: '' });
            const [numScenes, setNumScenes] = useState(4);

            const [isProducing, setIsProducing] = useState(false);
            const [showResult, setShowResult] = useState(false);
            const [generatedData, setGeneratedData] = useState(null);
            const [history, setHistory] = useState([]);
            const [copiedIndex, setCopiedIndex] = useState(null);

            useEffect(() => {
                const saved = JSON.parse(localStorage.getItem("LN_STORY_HISTORY_V8") || "[]");
                setHistory(saved);
            }, []);

            useEffect(() => {
                if (styleFamily) setSubStyle(STYLE_FAMILIES[styleFamily][0]);
            }, [styleFamily]);

            const getStepClass = (s) => {
                if (step === s) return "step-container active animate-slide-up";
                if (step > s) return "step-container done";
                return "step-container pending";
            };

            return (
                <div className="min-h-screen bg-[#F8FAFC] pb-24">

                    {/* HEADER */}
                    <header className="bg-white/90 backdrop-blur-lg border-b border-slate-200 p-5 sticky top-0 z-50 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2 rounded-2xl shadow-lg shadow-blue-100 text-white">
                                <Icon name="star" />
                            </div>
                            <div>
                                <h1 className="font-black text-xl tracking-tight text-slate-900 uppercase leading-none">
                                    Lintas Nusa <span className="text-blue-600">AI Studio</span>
                                </h1>
                                <p className="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase mt-1">
                                    Modular Creative Builder v8.0
                                </p>
                            </div>
                        </div>
                    </header>

                    {/* TRIAL NOTICE */}
                    <div className="bg-blue-50 border-b border-blue-100 text-center py-2">
                        <p className="text-[9px] font-bold text-blue-700 uppercase tracking-widest">
                            Versi Trial — Akses terbatas untuk uji coba
                        </p>
                        <p className="text-[8px] font-bold text-blue-400 uppercase tracking-wide">
                            Jika halaman ini tidak dapat diakses, masa trial telah berakhir
                        </p>
                    </div>

                    {/* MAIN */}
                    <main className="max-w-2xl mx-auto p-8 space-y-12">
                        <div className="text-center space-y-1">
                            <h2 className="text-3xl font-black tracking-tighter text-slate-900 uppercase italic">
                                Narrative Engine
                            </h2>
                            <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest italic leading-none">
                                Story-Driven Production Workflow
                            </p>
                        </div>

                        {/* STEP 1 */}
                        <div className={getStepClass(1)}>
                            <div className="step-number">1</div>
                            <h3 className="font-black text-xs uppercase tracking-widest mb-4">Story Core</h3>
                            <textarea
                                value={synopsis}
                                onChange={e => setSynopsis(e.target.value)}
                                placeholder="Tuliskan jalan cerita atau inti narasi Anda..."
                                className="w-full p-4 border-2 border-slate-100 rounded-2xl h-32 text-sm font-medium outline-none focus:border-blue-500 transition-all bg-white"
                            />
                            {step === 1 && synopsis && (
                                <button onClick={() => setStep(2)} className="mt-4 bg-blue-600 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg">
                                    Lanjut
                                </button>
                            )}
                        </div>

                        {/* STEP 2 */}
                        {step >= 2 && (
                            <div className={getStepClass(2)}>
                                <div className="step-number">2</div>
                                <h3 className="font-black text-xs uppercase tracking-widest mb-4">Production Flow</h3>
                                <div className="flex gap-2">
                                    {[3,4,5,6].map(n => (
                                        <button key={n} onClick={() => setNumScenes(n)} className={`flex-1 py-3 rounded-xl border-2 font-black text-xs ${numScenes === n ? 'bg-blue-600 border-blue-700 text-white' : 'bg-white border-slate-100 text-slate-400'}`}>
                                            {n} Scene
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setStep(3)} className="mt-4 bg-blue-600 text-white px-6 py-2.5 rounded-xl font-black text-[10px] uppercase shadow-lg">
                                    Lanjut
                                </button>
                            </div>
                        )}

                        {/* STEP 3 */}
                        {step >= 3 && (
                            <div className={getStepClass(3)}>
                                <div className="step-number">3</div>
                                <h3 className="font-black text-xs uppercase tracking-widest mb-4">Final Execution</h3>
                                <button className="w-full py-6 rounded-[2.5rem] bg-blue-600 text-white font-black uppercase tracking-[0.2em] shadow-2xl">
                                    Mulai Produksi Kreatif
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
